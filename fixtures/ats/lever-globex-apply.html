<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Globex Corporation - Backend Developer (fixture)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- QuietApply test fixture. A made-up company, modeled on the structure of a Lever application page. Never submits anywhere. -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
  ul { list-style: none; padding: 0; } .application-question { margin: 14px 0; }
  .application-label { font-weight: 600; } .required { color: #e74c3c; margin-left: 4px; }
  input[type=text], input[type=email], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  .template-btn-submit { background: #2a9d8f; color: #fff; border: 0; padding: 12px 22px; border-radius: 4px; }
</style>
</head>
<body>
<div class="posting-headline"><h2>Backend Developer</h2><div class="posting-categories"><div class="location">Springfield</div><div class="commitment">Full-time</div></div></div>
<form id="application-form" class="application-form" action="#" onsubmit="event.preventDefault(); document.getElementById('done').hidden = false;">
  <h4>Submit your application</h4>
  <ul>
    <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><input type="file" name="resume" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
  </ul>
  <h4>Links</h4>
  <ul>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
  </ul>
  <h4>Additional questions</h4>
  <ul>
    <li class="application-question custom-question">
      <div class="application-label">What is your notice period?<span class="required">✱</span></div>
      <div class="application-field"><input type="text" name="cards[c1a][field0]" required></div>
    </li>
    <li class="application-question custom-question">
      <div class="application-label">Are you willing to relocate to Springfield?<span class="required">✱</span></div>
      <ul class="application-field">
        <li><label><input type="radio" name="cards[c1a][field1]" value="Yes" required> Yes</label></li>
        <li><label><input type="radio" name="cards[c1a][field1]" value="No"> No</label></li>
      </ul>
    </li>
  </ul>
  <h4>Additional information</h4>
  <textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea>
  <button type="submit" class="template-btn-submit">Submit application</button>
  <p id="done" hidden>Application submitted (fixture page: nothing was sent).</p>
</form>
</body>
</html>
